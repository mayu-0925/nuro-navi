name: Deploy to Xserver

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["記事自動生成"]
    types:
      - completed
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy to Xserver via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF
          set net:timeout 120
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set ftp:passive-mode on
          set mirror:parallel-transfer-count 4
          mirror --reverse --delete --verbose --no-perms --exclude '.DS_Store' ./out/ $FTP_SERVER_DIR
          quit
          EOF

      - name: Ping Google Sitemap
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://www.nuro-navi.jp/sitemap.xml" \
            -o /dev/null -w "HTTP Status: %{http_code}\n"
